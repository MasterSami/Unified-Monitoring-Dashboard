<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Unified Monitoring Dashboard{% endblock %}</title>

    <!-- No flash of wrong theme: resolve before CSS loads. -->
    <script>
      (function () {
        var t =
          localStorage.getItem("theme") ||
          (window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>"
    />
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/theme.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo">📊</span>
          <span>
            Unified Monitor
            <span class="brand-sub">Ops Dashboard</span>
          </span>
        </div>

        <nav class="nav">
          <div class="nav-section">Monitoring</div>
          <a href="/" class="{{ 'active' if active_page == 'overview' else '' }}">
            <span class="ico">▦</span> Overview
          </a>
          <a href="/hosts" class="{{ 'active' if active_page == 'hosts' else '' }}">
            <span class="ico">▤</span> Hosts
          </a>
          <a href="/alerts" class="{{ 'active' if active_page == 'alerts' else '' }}">
            <span class="ico">◈</span> Alerts
          </a>
        </nav>

        <div class="sidebar-foot">
          <div
            id="health-strip"
            hx-get="/partials/health"
            hx-trigger="every 60s, refresh"
            hx-swap="innerHTML"
          >
            {% include "partials/health_strip.html" %}
          </div>
        </div>
      </aside>

      <div class="content">
        <header class="topbar">
          <div>
            <h1>{% block page_title %}Overview{% endblock %}</h1>
            <div class="sub">{% block page_sub %}{% endblock %}</div>
          </div>
          <div class="spacer"></div>
          <button
            class="btn btn-accent"
            type="button"
            title="Run all collectors now"
            onclick="refreshAll(event)"
          >
            <span class="htmx-indicator">⏳</span>
            <span class="rf-label">↻ Refresh now</span>
          </button>
          <button id="theme-toggle" class="icon-btn" type="button">☾</button>
        </header>

        <main class="page">{% block content %}{% endblock %}</main>
      </div>
    </div>

    <script>
      // "Refresh now" triggers every collector, then reloads HTMX regions.
      function refreshAll(event) {
        event.preventDefault();
        var btn = event.currentTarget;
        btn.classList.add("htmx-request");
        var collectors = ["zabbix", "dynatrace", "nnmi"];
        Promise.all(
          collectors.map(function (c) {
            return fetch("/api/v1/collectors/" + c + "/run", {
              method: "POST",
            }).catch(function () {});
          })
        ).then(function () {
          btn.classList.remove("htmx-request");
          if (window.htmx) {
            document
              .querySelectorAll("[data-refreshable]")
              .forEach(function (el) {
                window.htmx.trigger(el, "refresh");
              });
            var hs = document.getElementById("health-strip");
            if (hs) window.htmx.trigger(hs, "refresh");
          }
        });
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
